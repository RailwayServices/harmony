[package]
name = "harmony-api"
version = "0.1.0"
edition = "2021"

[dependencies]
harmony-common = { path = "../../crates/common" }
harmony-database = { path = "../../crates/database" }
harmony-modules = { path = "../../crates/modules" }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15.7"
sysinfo = "0.30"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

