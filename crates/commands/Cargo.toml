[package]
name = "railway-commands"
version = "0.1.0"
edition = "2021"

[dependencies]
railway-common = { path = "../common" }
railway-database = { path = "../database" }
railway-cache = { path = "../cache" }
railway-antinuke = { path = "../modules/antinuke" }
tokio = { version = "1.52", features = ["sync"] }
thiserror = "2"
tracing = "0.1"
twilight-model = "0.16"
twilight-http = "0.16"
twilight-util = { version = "0.16", features = ["builder"] }
chrono = { version = "0.4", features = ["serde"] }
