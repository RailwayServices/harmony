[package]
name = "harmony-commands"
version = "0.1.0"
edition = "2021"

[dependencies]
harmony-common = { path = "../common" }
harmony-database = { path = "../database" }
harmony-cache = { path = "../cache" }
harmony-modules = { path = "../modules" }
tokio = { version = "1.52", features = ["sync"] }
thiserror = "2"
tracing = "0.1"
serde_json = "1"
twilight-model = "0.17"
twilight-http = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
chrono = { version = "0.4", features = ["serde"] }
lavende = "1.0.3"
uuid = { version = "1.23.4", features = ["v4"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

