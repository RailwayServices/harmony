[package]
name = "harmony-messaging"
version = "0.1.0"
edition = "2024"

[dependencies]
harmony-common = { path = "../common" }
tokio = { version = "1.52", features = ["sync"] }
tracing = "0.1"
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
serde_json = "1"
futures = "0.3"
harmony-cache = { version = "0.1.0", path = "../cache" }
