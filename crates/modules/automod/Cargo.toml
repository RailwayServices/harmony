[package]
name = "railway-automod"
version = "0.1.0"
edition = "2021"

[dependencies]
railway-common = { path = "../../common" }
railway-database = { path = "../../database" }
railway-cache = { path = "../../cache" }
twilight-model = "0.17"
tracing = "0.1"
tokio = { version = "1.52", features = ["full"] }
regex = "1.10"
once_cell = "1.19"
redis = { version = "0.27", features = ["tokio-comp"] }
chrono = "0.4"
twilight-http = "0.17"
dashmap = "5.5.3"
