[package]
name = "harmony-common"
version = "0.1.0"
edition = "2021"

[dependencies]
twilight-model = "0.17"
twilight-http = { version = "0.17", default-features = false, features = ["simd-json", "rustls-native-roots"] }
twilight-util = { version = "0.17", features = ["builder"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["postgres"] }
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
tokio = { version = "1.52", features = ["sync"] }
dotenvy = "0.15"
lavende = "1.0.3"
