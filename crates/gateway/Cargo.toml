[package]
name = "harmony-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
harmony-common = { path = "../common" }
harmony-messaging = { path = "../messaging" }
twilight-gateway = { version = "0.17", default-features = false, features = ["twilight-http", "simd-json", "rustls-native-roots"] }
twilight-model = "0.17"
twilight-http = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"
tracing = "0.1"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
serde_json = "1.0.150"
futures = "0.3.32"
lavende = "1.0.3"
