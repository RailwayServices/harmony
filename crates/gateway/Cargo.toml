[package]
name = "railway-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
railway-common = { path = "../common" }
railway-messaging = { path = "../messaging" }
twilight-gateway = { version = "0.16", default-features = false, features = ["twilight-http", "simd-json", "rustls-native-roots", "rustls-ring"] }
twilight-model = "0.16"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"
tracing = "0.1"
