[workspace]
members = [
    "crates/common",
    "crates/database",
    "crates/cache",
    "crates/messaging",
    "crates/gateway",
    "crates/modules",
    "crates/commands",
    "apps/bot",
    "apps/gateway",
]
resolver = "2"

[workspace.package]
rust-version = "1.96.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
